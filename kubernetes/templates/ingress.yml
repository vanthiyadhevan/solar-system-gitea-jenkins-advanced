apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mychart.name" . }}
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mychart.name" . }}
                port:
                  number: 80
